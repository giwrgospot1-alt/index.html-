<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>I.C.P - giwrgospot Studio</title>
  <style>
    :root {
      --bg-main: #0a0a0c;
      --bg-card: rgba(20, 20, 25, 0.92);
      --bg-card-hover: rgba(28, 28, 36, 0.95);
      --accent: #ff2a5f;
      --accent-glow: rgba(255, 42, 95, 0.4);
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --border: rgba(255, 255, 255, 0.1);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="light"] {
      --bg-main: #f2f2f7;
      --bg-card: rgba(255, 255, 255, 0.92);
      --bg-card-hover: rgba(240, 240, 245, 0.95);
      --accent: #ff2a5f;
      --accent-glow: rgba(255, 42, 95, 0.25);
      --text-main: #1c1c1e;
      --text-muted: #6c6c70;
      --border: rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 20%, rgba(255, 42, 95, 0.15) 0%, transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(170, 0, 51, 0.1) 0%, transparent 50%);
      z-index: -2;
      pointer-events: none;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 40px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #ff2a5f, #aa0033);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-text p {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .icon-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 10px var(--accent-glow);
      font-weight: 700;
    }

    /* Player Card */
    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      backdrop-filter: blur(12px);
    }

    .track-info {
      display: flex;
      gap: 14px;
      align-items: center;
      cursor: pointer;
    }

    .album-art {
      width: 80px;
      height: 80px;
      border-radius: 14px;
      background: #1a1a24;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-details {
      flex: 1;
      min-width: 0;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(255, 42, 95, 0.15);
      color: var(--accent);
      font-size: 0.65rem;
      font-weight: 700;
      border-radius: 6px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .track-title {
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Karaoke Lyrics Box */
    .lyrics-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      min-height: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .lyrics-line {
      font-size: 0.85rem;
      color: var(--text-main);
      font-weight: 600;
    }

    /* Visualizer Canvas & Selector */
    .visualizer-container {
      width: 100%;
      height: 70px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
